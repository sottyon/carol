<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Plan a more joyful holiday season with the Interactive Holiday Planner."
    >
    <meta name="theme-color" content="#420460">
    <title>Holiday Planner</title>
    <style>
      :root {
        color-scheme: light;
        --lavender: #e7befd;
        --purple: #a311e8;
        --deep-purple: #420460;
        --white: #ffffff;
        --pink: #fd91e8;
        --ink: #0e0c0d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--white);
        background:
          radial-gradient(ellipse at 86% 12%, color-mix(in srgb, var(--purple) 35%, transparent), transparent 34rem),
          var(--deep-purple);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        width: min(100% - 3rem, 1200px);
        min-height: 78px;
        margin-inline: auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        color: var(--white);
        font-size: 1rem;
        font-weight: 750;
        letter-spacing: -0.02em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 12px;
        color: var(--ink);
        background: var(--pink);
        font-size: 1.15rem;
      }

      .canva-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0.65rem 1rem;
        border: 1px solid rgb(255 255 255 / 35%);
        border-radius: 999px;
        color: var(--white);
        font-size: 0.875rem;
        font-weight: 650;
        text-decoration: none;
        transition: background-color 160ms ease, border-color 160ms ease;
      }

      .canva-link:hover,
      .canva-link:focus-visible {
        border-color: var(--pink);
        background: rgb(253 145 232 / 14%);
      }

      .canva-link:focus-visible,
      .brand:focus-visible {
        outline: 3px solid var(--pink);
        outline-offset: 4px;
      }

      main {
        width: min(100% - 3rem, 1120px);
        margin: 0 auto;
        padding: clamp(1.75rem, 5vw, 3.75rem) 0 2.5rem;
      }

      .intro {
        margin: 0 auto 1.5rem;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.65rem;
        color: var(--pink);
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--white);
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 760;
        letter-spacing: -0.055em;
        line-height: 1.05;
      }

      .intro-copy {
        max-width: 36rem;
        margin: 0.8rem auto 0;
        color: var(--lavender);
        font-size: clamp(0.95rem, 2vw, 1.1rem);
        line-height: 1.6;
      }

      .planner-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        border: 1px solid rgb(231 190 253 / 32%);
        border-radius: 18px;
        background: var(--white);
      }

      .planner-frame iframe {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        background: var(--white);
      }

      footer {
        padding: 1.25rem 1rem 2rem;
        color: var(--lavender);
        font-size: 0.8rem;
        text-align: center;
      }

      footer a {
        color: var(--pink);
        text-underline-offset: 0.2em;
      }

      @media (max-width: 600px) {
        .site-header {
          width: min(100% - 2rem, 1200px);
          min-height: 68px;
        }

        .brand {
          gap: 0.55rem;
          font-size: 0.9rem;
        }

        .brand-mark {
          width: 34px;
          height: 34px;
        }

        .canva-link {
          min-height: 38px;
          padding: 0.55rem 0.8rem;
          font-size: 0.8rem;
        }

        main {
          width: 100%;
          padding: 1.75rem 0 1.5rem;
        }

        .intro {
          padding-inline: 1rem;
        }

        .planner-frame {
          border-right: 0;
          border-left: 0;
          border-radius: 0;
        }

        footer {
          padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="Holiday Planner home">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span>Holiday Planner</span>
      </a>
      <a
        class="canva-link"
        href="https://www.canva.com/design/DAHZ44UkUOA/pT-qOKAYrTbnBP3VYnzD-Q/view"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open in Canva
      </a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Plan a little magic</p>
        <h1 id="page-title">Your Holiday Planner</h1>
        <p class="intro-copy">
          Make space for the moments, traditions, and little details that make the season yours.
        </p>
      </section>

      <section class="planner-frame" aria-label="Interactive holiday planner">
        <iframe
          title="Interactive Holiday Planner"
          src="https://www.canva.com/design/DAHZ44UkUOA/pT-qOKAYrTbnBP3VYnzD-Q/view?embed"
          allowfullscreen
          allow="fullscreen"
        ></iframe>
      </section>
    </main>

    <footer>
      Interactive Holiday Planner by Sydney Tyler.
      <a
        href="https://www.canva.com/design/DAHZ44UkUOA/pT-qOKAYrTbnBP3VYnzD-Q/view"
        target="_blank"
        rel="noopener noreferrer"
      >View the original design</a>
    </footer>
  </body>
</html>
